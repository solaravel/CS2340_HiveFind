{% extends 'hivefind/base.html' %}

{% block title %}Applicant Map &middot; HiveFind{% endblock %}

{% block head %}
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css" referrerpolicy="no-referrer">
  <style>#applicantMap { height: 72vh; }</style>
{% endblock %}

{% block content %}
<div class="p-3">
  <h1>Applicant Map</h1>
  <p>See where the people who applied to your jobs are located.</p>
  <div id="applicantMap"></div>
</div>
{% endblock %}

{% block scripts %}
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js" referrerpolicy="no-referrer"></script>
  <script>
    var map = L.map('applicantMap').setView([37.8, -96], 4);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19, attribution: 'Tiles &copy; Esri'
    }).addTo(map);
    var cluster = L.markerClusterGroup();
    fetch('{% url "applications.applicant_map_data" %}')
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var pts = [];
        data.applicants.forEach(function (a) {
          var m = L.marker([a.lat, a.lng]).bindPopup(a.name + ' &mdash; ' + a.job);
          cluster.addLayer(m);
          pts.push([a.lat, a.lng]);
        });
        map.addLayer(cluster);
        if (pts.length) { map.fitBounds(pts, { padding: [40, 40], maxZoom: 11 }); }
      });
  </script>
{% endblock %}
