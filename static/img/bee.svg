<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 190" width="230" height="190">
  <defs>
    <filter id="sticker" x="-25%" y="-25%" width="150%" height="150%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="5" result="d"/>
      <feFlood flood-color="#ffffff" result="w"/>
      <feComposite in="w" in2="d" operator="in" result="outline"/>
      <feMerge><feMergeNode in="outline"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="bodyclip"><ellipse cx="118" cy="106" rx="78" ry="62"/></clipPath>
  </defs>

  <g class="bee-sprite" filter="url(#sticker)">
    <!-- antennae -->
    <path d="M150 52 C146 24 168 22 172 10" fill="none" stroke="#1b1b1b" stroke-width="5" stroke-linecap="round"/>
    <circle cx="172" cy="9" r="5" fill="#1b1b1b"/>
    <path d="M170 54 C176 28 196 30 202 20" fill="none" stroke="#1b1b1b" stroke-width="5" stroke-linecap="round"/>
    <circle cx="202" cy="19" r="5" fill="#1b1b1b"/>

    <!-- wings -->
    <g class="bee-wings">
      <ellipse cx="74" cy="50" rx="30" ry="44" fill="#CFE8F6" stroke="#1b1b1b" stroke-width="5" transform="rotate(-34 74 50)"/>
      <ellipse cx="106" cy="42" rx="26" ry="40" fill="#CFE8F6" stroke="#1b1b1b" stroke-width="5" transform="rotate(-8 106 42)"/>
    </g>

    <!-- stinger -->
    <path d="M44 106 L20 96 L30 116 Z" fill="#1b1b1b"/>

    <!-- body -->
    <ellipse cx="118" cy="106" rx="78" ry="62" fill="#FFD24D" stroke="#1b1b1b" stroke-width="6"/>

    <!-- stripes -->
    <g clip-path="url(#bodyclip)" fill="#1b1b1b">
      <path d="M46 40 q10 -6 20 0 v132 q-10 6 -20 0 z"/>
      <path d="M80 34 q11 -6 22 0 v146 q-11 6 -22 0 z"/>
      <path d="M116 36 q11 -5 22 0 v140 q-11 5 -22 0 z"/>
    </g>

    <!-- face -->
    <ellipse cx="150" cy="102" rx="6" ry="8" fill="#1b1b1b"/>
    <ellipse cx="176" cy="102" rx="6" ry="8" fill="#1b1b1b"/>
    <circle cx="152" cy="99" r="1.8" fill="#fff"/>
    <circle cx="178" cy="99" r="1.8" fill="#fff"/>
    <ellipse cx="144" cy="118" rx="8" ry="5" fill="#FFA7B5"/>
    <ellipse cx="182" cy="118" rx="8" ry="5" fill="#FFA7B5"/>
    <path d="M151 116 Q163 128 175 116" fill="none" stroke="#1b1b1b" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
