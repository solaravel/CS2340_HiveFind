{% extends 'hivefind/base.html' %}
{% block content %}
{% load static %}
<div class="p-3">
  <div class="container">
    <div class="row mt-3">
      <div class="col mx-auto mb-3">
        <h2>List of Jobs</h2>
        <hr />
      </div>
    </div>
    <div class="row">
      {% for job in template_data.jobs %}
      <div class="col-md-4 col-lg-3 mb-2">
        <div class="p-2 card align-items-center pt-4">
          <div class="card h-100">
        <div class="card-body">
          <h5 class="card-title">{{ job.title }}</h5>

          <h6 class="card-subtitle mb-2 text-muted">
            {{ job.company }}
          </h6>

          <p class="card-text">
            {{ job.description }}
          </p>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</div>
{% endblock content %}
